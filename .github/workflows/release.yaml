name: release
run-name: release v${{ github.event_name == 'repository_dispatch' && github.event.client_payload.version || github.event.inputs.version }}
on:
  repository_dispatch:
    types:
      - reqrio-release
  workflow_dispatch:
    inputs:
      version:
        description: "目标版本号（不含 v 前缀），例如 0.3.0 或 0.3.0-alpha3"
        required: true
        type: string
jobs:
  # ----------------------------------------------------------------------------
  # 版本号 bump：改好所有文件版本号后提交到「临时分支」ci/release-<version>，
  # 不直接推主分支；下游全部基于该临时分支构建/发布，
  # 待所有任务成功后由 finalize 合并回主分支并打 tag
  # ----------------------------------------------------------------------------
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Get release version
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "VERSION=${{ github.event.client_payload.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          fi
          echo $VERSION
      - name: Release bindings
        run: |
          echo "release version: ${{ github.event.client_payload.version }}"
      - name: Bump version in all packages
        run: |
          set -euo pipefail

          # Python（子模块 bindings 自己维护）
          sed -i -E 's/^version = "[^"]*"/version = "'"$VERSION"'"/' python/pyproject.toml
          sed -i -E 's/(version=")[^"]*(")/\1'"$VERSION"'\2/' python/setup.py

          # Java（仅项目 version，4 空格缩进，避免误伤依赖/插件版本）
          sed -i -E 's#^    <version>[^<]*</version>#    <version>'"$VERSION"'</version>#' java/pom.xml

          # Node.js
          sed -i -E 's/("version": ")[^"]*(")/\1'"$VERSION"'\2/' nodejs/package.json

      - name: Find latest reqrio release run
        id: reqrio-run
        env:
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/xllgl2017/reqrio/actions/workflows/release.yml/runs?status=success&per_page=1")

          echo "$RESPONSE" | jq .
        
          RUN_ID=$(echo "$RESPONSE" | jq -r '.workflow_runs[0].id')

          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
      # go 需要 linux .so（native-linux）与 windows-gnu .dll（go-windows-gnu）
      - name: Download linux native lib
        uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: natives
          repository: xllgl2017/reqrio
          run-id: ${{ steps.reqrio-run.outputs.run_id }}
          github-token: ${{ secrets.GIT_TOKEN }}
      - name: Download windows-msvc native lib
        uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: natives
          repository: xllgl2017/reqrio
          run-id: ${{ steps.reqrio-run.outputs.run_id }}
          github-token: ${{ secrets.GIT_TOKEN }}
      - name: Download windows-gnu dll
        uses: actions/download-artifact@v4
        with:
          name: go-windows-gnu
          path: natives-go
          repository: xllgl2017/reqrio
          run-id: ${{ steps.reqrio-run.outputs.run_id }}
          github-token: ${{ secrets.GIT_TOKEN }}

      - name: copy natives libraries
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # go
          cp natives/libreqrio.so go/
          cp natives-go/reqrio.dll go/
          cp natives-go/libreqrio.dylib go/
          #python
          cp natives/reqrio.dll python/reqrio/
          cp natives/libreqrio.so python/reqrio/
          cp natives/libreqrio.dylib python/reqrio/
          # nodejs
          cp natives/reqrio.dll nodejs/
          cp natives/libreqrio.so nodejs/
          cp natives/libreqrio.dylib nodejs/
          # java
          cp natives/reqrio.dll java/src/main/resources/
          cp natives/libreqrio.so java/src/main/resources/
          cp natives/libreqrio.dylib java/src/main/resources/
          # qt
          cp natives/reqrio.dll qt/
          cp natives/reqrio.dll.lib qt/reqrio.lib
          cp natives/libreqrio.so qt/
          cp natives/libreqrio.dylib qt/
      - name: commit changes
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f \
            go/libreqrio.so go/reqrio.dll go/libreqrio.dylib \
            python/reqrio/reqrio.dll python/reqrio/libreqrio.so python/reqrio/libreqrio.dylib \
            nodejs/reqrio.dll nodejs/libreqrio.so nodejs/libreqrio.dylib \
            java/src/main/resources/reqrio.dll java/src/main/resources/libreqrio.so java/src/main/resources/libreqrio.dylib \
            qt/reqrio.dll qt/reqrio.lib qt/libreqrio.so qt/libreqrio.dylib \
            python/pyproject.toml \
            python/setup.py \
            java/pom.xml \
            nodejs/package.json
          if ! git diff --cached --quiet; then
            git commit -m "update all bindings to ${VERSION}"
            git push origin "${{ github.ref_name }}"
          else
            echo "bindings submodule has no native lib changes to commit"
          fi
          # 打并推送 go module tag（指向含原生库的提交）
          git tag "go/v${VERSION}"
          git push origin "go/v${VERSION}"

  # ----------------------------------------------------------------------------
  # Python → PyPI（打包同时携带 .so 与 .dll）
  # ----------------------------------------------------------------------------
  publish-pypi:
    name: publish-pypi (PyPI)
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel & sdist
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ----------------------------------------------------------------------------
  # Java → Maven Central（central-publishing-maven-plugin + gpg）
  # ----------------------------------------------------------------------------
  publish-maven:
    name: publish-maven (Maven Central)
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup JDK + Maven settings
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Deploy to Maven Central
        working-directory: java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn --batch-mode clean deploy

  # ----------------------------------------------------------------------------
  # Node.js → npm（打包同时携带 .so 与 .dll）
  # ----------------------------------------------------------------------------
  publish-npm:
    name: publish-npm (npm)
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        working-directory: nodejs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public